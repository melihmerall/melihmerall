<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="t d">
  <title id="t">Melih Meral — Senior Software Developer</title>
  <desc id="d">Terminal window: whoami returns Melih Meral, Senior Software Developer. Stack: .NET, React and Next.js, Azure and Docker, LLM integration. 5+ years, 15+ shipped projects.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .prompt { fill: #1a7f37; }
    .cmd { fill: #1f2328; }
    .name { fill: #1f2328; font-weight: 700; }
    .role { fill: #0969da; }
    .muted { fill: #59636e; }
    .num { fill: #1f2328; font-weight: 700; }
    .l { opacity: 0; animation: in .45s ease-out forwards; }
    .l1 { animation-delay: .15s; } .l2 { animation-delay: .55s; } .l3 { animation-delay: .8s; }
    .l4 { animation-delay: 1.25s; } .l5 { animation-delay: 1.55s; } .l6 { animation-delay: 1.95s; }
    .s1 { animation-delay: 2.1s; } .s2 { animation-delay: 2.25s; } .s3 { animation-delay: 2.4s; }
    .cursor { animation: blink 1.1s steps(1) infinite 2.2s; }
    @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .l { animation: none; opacity: 1; } .cursor { animation: none; } }
  </style>

  <rect x="1" y="1" width="998" height="338" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="1.5" y="1.5" width="997" height="39.5" rx="13.5" fill="#f6f8fa"/>
  <rect x="1.5" y="28" width="997" height="13" fill="#f6f8fa"/>
  <path d="M1 41 H999" stroke="#d0d7de"/>
  <circle cx="26" cy="21" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="21" r="6" fill="#febc2e"/>
  <circle cx="66" cy="21" r="6" fill="#28c840"/>
  <text x="500" y="26" text-anchor="middle" class="mono muted" font-size="13">melih@portfolio: ~</text>

  <g class="mono">
    <text x="40" y="88" font-size="15" class="l l1"><tspan class="prompt">melih@portfolio:~$</tspan><tspan class="cmd"> whoami</tspan></text>
    <text x="40" y="140" font-size="40" class="name l l2">Melih Meral</text>
    <text x="40" y="174" font-size="18" class="role l l3">Senior Software Developer · Team Lead</text>
    <text x="40" y="222" font-size="15" class="l l4"><tspan class="prompt">melih@portfolio:~$</tspan><tspan class="cmd"> cat stack.txt</tspan></text>
    <text x="40" y="252" font-size="15" class="muted l l5">.NET · React / Next.js · Azure · Docker · LLM integration</text>
    <g class="l l6">
      <text x="40" y="300" font-size="15" class="prompt">melih@portfolio:~$</text>
      <rect x="210" y="287" width="9" height="17" fill="#1f2328" class="cursor"/>
    </g>
  </g>

  <path d="M720 72 V308" stroke="#d0d7de"/>
  <g class="mono">
    <g class="l s1"><text x="760" y="112" font-size="32" class="num">5+</text><text x="760" y="134" font-size="12" class="muted">years in production</text></g>
    <g class="l s2"><text x="760" y="194" font-size="32" class="num">15+</text><text x="760" y="216" font-size="12" class="muted">projects shipped</text></g>
    <g class="l s3"><text x="760" y="276" font-size="32" class="num">∞</text><text x="760" y="298" font-size="12" class="muted">coffee</text></g>
  </g>
</svg>
